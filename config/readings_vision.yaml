# (poste 16, cf. détail p.6 "Assise en gros béton"). Les 23 semelles sont
# réparties ainsi dans le métré de référence ; la logique de zonage (dalles
# DP20/DP13) n'est pas cotée sur le plan — répartition reprise du métré.
# ---------------------------------------------------------------------------
semelles_proprete:  [A1, A2, A4, A5, A6, A7, D1]
semelles_gros_beton: [A8, B5, C6, C7, C8, E6, E7, E8, F5, G1, G2, G3, G5, G6, G7, G8]

