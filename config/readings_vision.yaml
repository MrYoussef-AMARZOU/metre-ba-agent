  A1: S1
  A2: S4
  A4: S4
  A5: S2
  A6: S3
  A7: S3
  A8: S3
  B5: S5
  C6: S4
  C7: S4
  C8: S3
  D1: S4
  E6: S4
  E7: S4
  E8: S3
  F5: S5
  G1: S1
  G2: S4
  G3: S4
  G5: S5
  G6: S3
  G7: S3
  G8: S3

# ---------------------------------------------------------------------------
