# ============================================================================
# Lectures "vision" du plan — éléments non extractibles du texte natif du PDF
# (texte AutoCAD converti en courbes). Chaque bloc cite la page du plan.
# Éditable : c'est ici qu'on ajuste la lecture d'un nouveau plan après
# vérification visuelle (ou via extract_plan.py --vision avec une clé API).
# Provenance : lecture des rendus 200-600 dpi par l'agent, recoupée avec le
# métré de référence. Les entrées douteuses portent a_verifier: true.
# ============================================================================

provenance: >
  Pages lues : 1 (FONDATION), 2 (Mezzanine), 3 (PH-RDC), 4 (tableau semelles,
  texte natif), 5 (types poutres, texte natif), 6 (détails).

# ---------------------------------------------------------------------------
# Page 1 — type de poteau à chaque intersection (étiquettes P1..P4 en courbes)
# Incohérence relevée : les étiquettes des poteaux B5/F5 se lisent "P4" sur le
# plan FONDATION mais "P2" sur le plan PH-RDC. Le métré de référence retient
# P4 (35x35) — repris ici, à confirmer avec le BET. (a_verifier)
# ---------------------------------------------------------------------------
poteaux:
  A1: P3
  A2: P2
  A4: P2
  A5: P3
  A6: P1
  A7: P1
  A8: P1
  B5: P4
  C6: P1
  C7: P1
  C8: P1
  D1: P2
  E6: P1
  E7: P1
  E8: P1
  F5: P4
  G1: P3
  G2: P2
  G3: P2
  G5: P3
  G6: P1
  G7: P1
  G8: P1

# ---------------------------------------------------------------------------
# Page 1 — semelles : type à chaque intersection. Les étiquettes S?(AxBxH) sont
# du TEXTE NATIF (extractibles) ; ce mapping les confirme par lecture image.
# ---------------------------------------------------------------------------
